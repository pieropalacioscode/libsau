{{define "content"}}
<div class="max-w-2xl mx-auto space-y-6">

  <!-- Estado del día -->
  <div class="card" id="today-summary">
    <div class="flex items-center gap-3 mb-5">
      <span class="text-3xl">💰</span>
      <div>
        <h2 class="font-bold text-gray-800 text-lg">Cierre de Caja</h2>
        <p class="text-gray-500 text-sm" id="cash-date">Cargando...</p>
      </div>
      <div class="ml-auto">
        <span id="cash-status-badge" class="badge bg-green-100 text-green-700">Abierta</span>
      </div>
    </div>

    <!-- Resumen calculado -->
    <div class="grid grid-cols-2 gap-3 mb-5" id="cash-metrics">
      <div class="bg-gray-50 rounded-xl p-4 text-center">
        <p class="text-xs text-gray-500 mb-1">Ventas</p>
        <p class="text-2xl font-bold text-gray-800" id="cash-count">—</p>
      </div>
      <div class="bg-gray-50 rounded-xl p-4 text-center">
        <p class="text-xs text-gray-500 mb-1">Total Ingresos</p>
        <p class="text-2xl font-bold text-primary-700" id="cash-revenue">—</p>
      </div>
    </div>

    <!-- Desglose por método -->
    <div class="border-t border-gray-100 pt-4 space-y-2" id="cash-breakdown">
      <div class="animate-pulse bg-gray-100 rounded h-8"></div>
      <div class="animate-pulse bg-gray-100 rounded h-8"></div>
    </div>
  </div>

  <!-- Formulario de cierre -->
  <div class="card" id="close-form-card">
    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
      <span>✍️</span> Declaración del Vendedor
    </h3>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">
          Efectivo en caja (S/)
          <span class="text-xs text-gray-400 ml-1">— Cuenta el dinero físicamente</span>
        </label>
        <input type="number" id="cash-declared" min="0" step="0.50" placeholder="0.00"
          class="input-base text-lg font-bold py-3">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">
          Notas (opcional)
        </label>
        <textarea id="cash-notes" rows="2" placeholder="Observaciones del día..."
          class="input-base resize-none"></textarea>
      </div>

      <!-- Preview diferencia en tiempo real -->
      <div id="diff-preview" class="rounded-xl p-4 bg-gray-50 hidden">
        <div class="flex justify-between text-sm">
          <span class="text-gray-600">Efectivo calculado por el sistema:</span>
          <span class="font-bold" id="diff-calc">—</span>
        </div>
        <div class="flex justify-between text-sm mt-1">
          <span class="text-gray-600">Efectivo declarado:</span>
          <span class="font-bold" id="diff-declared">—</span>
        </div>
        <div class="border-t border-gray-200 mt-2 pt-2 flex justify-between">
          <span class="font-semibold text-gray-700">Diferencia:</span>
          <span class="font-bold text-lg" id="diff-value">—</span>
        </div>
      </div>

      <button onclick="submitClose()" id="btn-close"
        class="w-full btn-primary py-3.5 text-base">
        Cerrar Caja del Día
      </button>

      <p id="close-error" class="text-red-600 text-sm text-center hidden"></p>
    </div>
  </div>

  <!-- Historial -->
  <div class="card">
    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
      <span>📋</span> Historial de Cierres
    </h3>
    <div id="cash-history">
      <div class="animate-pulse bg-gray-100 rounded h-10"></div>
    </div>
  </div>
</div>
<script src="/static/js/api.js"></script>
<script>
let cashData = null;

// 🚀 INIT
if (window.location.pathname === "/cash") {
  document.addEventListener('DOMContentLoaded', init);
  document.addEventListener('auth:login', init);
}

async function init() {
  await loadToday();
  await loadHistory();
}

// ─────────────────────────────
// 🔥 HOY
// ─────────────────────────────
async function loadToday() {
  const res = await api('GET', '/api/v1/cash/today');

  console.log("RES TODAY:", res);

  if (!res || res.error) {
    console.error("Error cargando caja");
    return;
  }

  cashData = res.data;

  // Fecha
  document.getElementById('cash-date').textContent =
    new Date(cashData.date).toLocaleDateString('es-PE', {
      weekday:'long', year:'numeric', month:'long', day:'numeric'
    });

  // KPIs
  document.getElementById('cash-count').textContent   = cashData.sales_count;
  document.getElementById('cash-revenue').textContent = 'S/ ' + cashData.revenue.toFixed(2);

  // Métodos
  const methods = ['EFECTIVO','YAPE','PLIN','TARJETA'];
  const icons   = { EFECTIVO:'💵', YAPE:'📱', PLIN:'💳', TARJETA:'🏦' };

  document.getElementById('cash-breakdown').innerHTML = methods.map(m => `
    <div class="flex justify-between items-center py-1.5">
      <span class="text-sm text-gray-600">${icons[m]} ${m}</span>
      <span class="font-semibold text-gray-800 text-sm">
        S/ ${(cashData.by_method[m] || 0).toFixed(2)}
      </span>
    </div>
  `).join('');

  // Estado
  if (cashData.already_closed) {
    document.getElementById('cash-status-badge').textContent = 'Cerrada';
    document.getElementById('cash-status-badge').className =
      'badge bg-gray-100 text-gray-600';

    document.getElementById('close-form-card').innerHTML = `
      <div class="flex items-center gap-3 text-green-700">
        <span class="text-3xl">✅</span>
        <div>
          <p class="font-bold">Caja cerrada</p>
          <p class="text-sm text-gray-500">
            La caja de hoy ya fue cerrada correctamente.
          </p>
        </div>
      </div>`;
  }

  // Preview en tiempo real
  const input = document.getElementById('cash-declared');
  if (input) {
    input.addEventListener('input', function() {
      const declared = parseFloat(this.value) || 0;
      const calcCash = cashData.by_method['EFECTIVO'] || 0;
      const diff     = declared - calcCash;

      const preview = document.getElementById('diff-preview');
      preview.classList.remove('hidden');

      document.getElementById('diff-calc').textContent     = 'S/ ' + calcCash.toFixed(2);
      document.getElementById('diff-declared').textContent = 'S/ ' + declared.toFixed(2);

      const diffEl = document.getElementById('diff-value');

      if (Math.abs(diff) < 0.01) {
        diffEl.textContent = '✅ S/ 0.00 (cuadrada)';
        diffEl.className   = 'font-bold text-lg text-green-700';
        preview.className  = 'rounded-xl p-4 bg-green-50';

      } else if (diff < 0) {
        diffEl.textContent = '❌ S/ ' + diff.toFixed(2) + ' (faltante)';
        diffEl.className   = 'font-bold text-lg text-red-600';
        preview.className  = 'rounded-xl p-4 bg-red-50';

      } else {
        diffEl.textContent = '⬆️ S/ +' + diff.toFixed(2) + ' (sobrante)';
        diffEl.className   = 'font-bold text-lg text-orange-600';
        preview.className  = 'rounded-xl p-4 bg-orange-50';
      }
    });
  }
}

// ─────────────────────────────
// 📋 HISTORIAL
// ─────────────────────────────
async function loadHistory() {
  const res = await api('GET', '/api/v1/cash/history');

  console.log("RES HISTORY:", res);

  if (!res || res.error) return;

  const data = res.data.data; // 🔥 FIX REAL

  if (!data || data.length === 0) {
    document.getElementById('cash-history').innerHTML =
      '<p class="text-gray-400 text-sm text-center py-4">Sin cierres registrados</p>';
    return;
  }

  document.getElementById('cash-history').innerHTML = `
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <tbody>
          ${data.map(c => `
            <tr>
              <td>${new Date(c.date).toLocaleDateString('es-PE')}</td>
              <td>${c.sales_count}</td>
              <td>S/ ${c.revenue_calc.toFixed(2)}</td>
              <td>${c.difference.toFixed(2)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;
}

// ─────────────────────────────
// 🔒 CERRAR CAJA
// ─────────────────────────────
async function submitClose() {
  const declared = parseFloat(document.getElementById('cash-declared').value);
  const notes    = document.getElementById('cash-notes').value;

  if (isNaN(declared) || declared < 0) {
    alert('Monto inválido');
    return;
  }

  const res = await api('POST', '/api/v1/cash/close', {
    cash_declared: declared,
    notes,
  });

  if (!res || res.error) {
    alert('Error al cerrar caja');
    return;
  }

  alert('Caja cerrada correctamente');
  await init();
}
document.addEventListener('DOMContentLoaded', () => {
  const token = sessionStorage.getItem('access_token');

  if (!token) {
    window.location.href = '/login';
    return;
  }
});
</script>
{{end}}
