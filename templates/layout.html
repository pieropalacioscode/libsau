{{define "layout"}}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/static/css/output.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <title>Librería Saber</title>
</head>

<body class="h-full bg-gray-50 flex" id="app">

  <aside id="sidebar"
    class="w-60 bg-primary-900 flex flex-col fixed inset-y-0 left-0 z-30 shadow-xl">

    <div class="flex items-center gap-3 px-5 py-5 border-b border-primary-800">
      <span class="text-2xl">📚</span>
      <div>
        <p class="text-white font-bold text-sm leading-tight">Librería Saber</p>
        <p class="text-primary-400 text-xs">Sistema de Ventas</p>
      </div>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <p class="text-primary-500 text-xs font-semibold uppercase tracking-wider px-3 mb-2">
        Ventas
      </p>
      <a href="/pos" class="nav-link" id="nav-pos">
        <span class="text-lg">🛒</span> Punto de Venta
      </a>

      <p class="text-primary-500 text-xs font-semibold uppercase tracking-wider px-3 mt-4 mb-2">
        Gestión
      </p>
      <a href="/products" class="nav-link" id="nav-products">
        <span class="text-lg">📦</span> Productos
      </a>
      <a href="/cash" class="nav-link" id="nav-cash">
        <span class="text-lg">💰</span> Cierre de Caja
      </a>
    </nav>

    <div class="px-3 py-4 border-t border-primary-800">
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary-800">
        <div class="w-8 h-8 rounded-full bg-primary-600 flex items-center justify-center text-white text-sm font-bold"
          id="user-avatar">A</div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-sm font-medium truncate" id="user-name">Cargando...</p>
          <p class="text-primary-400 text-xs" id="user-role"></p>
        </div>
        <button onclick="logout()" title="Cerrar sesión"
          class="text-primary-400 hover:text-white transition text-lg">⇠</button>
      </div>
    </div>
  </aside>

  <div class="flex-1 ml-60 flex flex-col min-h-screen">

    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
      <h1 class="text-gray-800 font-semibold text-base" id="page-title">Librería Saber</h1>
      <div class="flex items-center gap-3">
        <span class="text-xs text-gray-400" id="current-time"></span>
        <span class="badge bg-success-50 text-success-700" id="connection-status">● Online</span>
      </div>
    </header>

    <main class="flex-1 p-6 overflow-auto">
      {{template "content" .}}
    </main>

  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2"></div>
  <script src="/static/js/api.js"></script>

  <script>
  // ── Gestión de autenticación ───────────────────────────────────────────────
  const Auth = {
    getToken: () => sessionStorage.getItem('access_token'),
    setToken: (t) => sessionStorage.setItem('access_token', t),
    clear:    () => sessionStorage.removeItem('access_token'),
    getUser:  () => {
      const raw = sessionStorage.getItem('current_user');
      return raw ? JSON.parse(raw) : null;
    },
    setUser: (u) => sessionStorage.setItem('current_user', JSON.stringify(u)),
  };

  // ── Verificar token al cargar ──────────────────────────────────────────────
  // document.addEventListener('DOMContentLoaded', function() {
  //   updateClock();
  //   setInterval(updateClock, 1000);
  //   setActivePage();

  //   const token = Auth.getToken();
  //   if (!token) {
  //     showLoginOverlay();
  //   } else {
  //     loadUserInfo();
  //   }
  // });

  function setActivePage() {
    const path = window.location.pathname;
    
    // DASHBOARD ELIMINADO DE LOS MAPAS
    const map = {
      '/pos':      'nav-pos',
      '/products': 'nav-products',
      '/cash':     'nav-cash',
    };
    const titles = {
      '/pos':      'Punto de Venta',
      '/products': 'Gestión de Productos',
      '/cash':     'Cierre de Caja',
    };

    Object.values(map).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.remove('active');
    });

    const activeId = map[path];
    if (activeId) {
      const el = document.getElementById(activeId);
      if (el) el.classList.add('active');
    }

    const titleEl = document.getElementById('page-title');
    if (titleEl && titles[path]) titleEl.textContent = titles[path];
  }

  function updateClock() {
    const el = document.getElementById('current-time');
    if (el) {
      el.textContent = new Date().toLocaleTimeString('es-PE', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
  }
  
  document.addEventListener("DOMContentLoaded", () => {
  const path = window.location.pathname;

  // permitir login sin token
  if (path === "/login") return;

  // proteger todo lo demás
  if (!Auth.getToken()) {
    window.location = "/login";
    return;
  }

  // inicialización normal
  updateClock();
  setInterval(updateClock, 1000);
  setActivePage();
  loadUserInfo();
  });

  // ── Login ──────────────────────────────────────────────────────────────────
async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl    = document.getElementById('login-error');
  const btn      = document.getElementById('login-btn');

  if (!email || !password) {
    errEl.textContent = 'Completa todos los campos';
    errEl.classList.remove('hidden');
    return;
  }

  btn.textContent = 'Ingresando...';
  btn.disabled = true;
  errEl.classList.add('hidden');

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await res.json();

    if (!res.ok || !data.access_token) {
      errEl.textContent = data.error || 'Credenciales incorrectas';
      errEl.classList.remove('hidden');
      return;
    }

    // ✅ guardar sesión
    Auth.setToken(data.access_token);
    Auth.setUser(data.user || {});

    // 💣 AQUÍ ESTÁ LA CLAVE
    window.location = "/pos";

  } catch (_err) {
    errEl.textContent = 'Error de conexión con el servidor';
    errEl.classList.remove('hidden');
  } finally {
    btn.textContent = 'Iniciar Sesión';
    btn.disabled = false;
  }
}

  // ── Logout ─────────────────────────────────────────────────────────────────
async function logout() {

  const token = sessionStorage.getItem('access_token');

  try {
    if (token) {
      await fetch('/auth/logout', {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + token
        }
      });
    }
  } catch (e) {
    console.warn(e);
  }

  sessionStorage.removeItem('access_token');
  sessionStorage.removeItem('current_user');

  window.location.href = '/login';
}
  // ── Cargar info del usuario en el sidebar ──────────────────────────────────
  async function loadUserInfo() {
    const token = Auth.getToken();
    if (!token) return;

    try {
      const res = await fetch('/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (res.status === 401) { logout(); return; }
      const user = await res.json();
      Auth.setUser(user);

      const nameEl   = document.getElementById('user-name');
      const roleEl   = document.getElementById('user-role');
      const avatarEl = document.getElementById('user-avatar');

      if (nameEl)   nameEl.textContent   = user.name || user.email;
      if (roleEl)   roleEl.textContent   = user.role || '';
      if (avatarEl) avatarEl.textContent = (user.name || 'U')[0].toUpperCase();

    } catch (_err) { /* continuar con los datos de sesión cacheados */ } 
  }

  // ── HTMX: adjuntar token en cada request ──────────────────────────────────
  document.addEventListener('htmx:configRequest', function(e) {
    const token = Auth.getToken();
    if (token) e.detail.headers['Authorization'] = 'Bearer ' + token;
  });

  document.addEventListener('htmx:responseError', function(e) {
    if (e.detail.xhr.status === 401) logout();
  });

  // ── Toast notifications ────────────────────────────────────────────────────
  function toast(message, type = 'info', duration = 3500) {
    const colors = {
      success: 'bg-success-600 text-white',
      error:   'bg-danger-600 text-white',
      warn:    'bg-warn-500 text-white',
      info:    'bg-primary-600 text-white',
    };
    const icons = { success:'✅', error:'❌', warn:'⚠️', info:'ℹ️' };

    const el = document.createElement('div');
    el.className = `flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm font-medium
                    ${colors[type]} transform translate-y-2 opacity-0 transition-all duration-300`;
    el.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;

    document.getElementById('toast-container').appendChild(el);

    requestAnimationFrame(() => {
      el.classList.remove('translate-y-2', 'opacity-0');
    });

    setTimeout(() => {
      el.classList.add('opacity-0', 'translate-y-2');
      setTimeout(() => el.remove(), 300);
    }, duration);
  }

  // ── Beeps de audio ─────────────────────────────────────────────────────────
  function beep(freq = 880, duration = 100, vol = 0.2) {
    try {
      const ctx  = new (window.AudioContext || window.webkitAudioContext)();
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.value = vol;
      osc.start();
      osc.stop(ctx.currentTime + duration / 1000);
    } catch (_err) { /* AudioContext no disponible */ } 
  }

  function beepOk()    { beep(880, 80,  0.15); }
  function beepError() { beep(300, 400, 0.2);  }

  // ── Lector de código de barras (HID) ──────────────────────────────────────
  (function() {
    let buffer   = '';
    let lastTime = 0;
    let barcodeTimer = null; 

    document.addEventListener('keydown', function(e) {
      const now    = Date.now();
      const active = document.activeElement;
      const skip   = active &&
                     active.tagName === 'INPUT' &&
                     active.id !== 'pos-search';
      if (skip) return;

      if (e.key === 'Enter' && buffer.length > 2) {
        const sku = buffer.trim();
        buffer = '';
        const input = document.getElementById('pos-search');
        if (input) {
          input.value = sku;
          htmx.trigger(input, 'scanner');
        }
        return;
      }

      if (e.key.length === 1) {
        if (now - lastTime < 60 || buffer.length > 0) {
          buffer += e.key;
        } else {
          buffer = e.key;
        }
      }

      lastTime = now;
      clearTimeout(barcodeTimer);
      barcodeTimer = setTimeout(() => { buffer = ''; }, 600);
    });
  })();
  </script>

</body>
</html>
{{end}}
