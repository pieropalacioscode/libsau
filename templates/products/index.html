{{define "content"}}
<div class="space-y-5">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-gray-800">Gestión de Productos</h2>
      <p class="text-gray-500 text-sm">Catálogo · Stock · Precios</p>
    </div>
    <button onclick="openCreateModal()"
      class="btn-primary flex items-center gap-2">
      <span>+</span> Nuevo Producto
    </button>
  </div>

  <!-- Buscador -->
  <div class="card p-4">
    <input type="text" id="prod-search" placeholder="Buscar producto..."
      class="input-base"
      oninput="filterProducts(this.value)">
  </div>

  <!-- Tabla -->
  <div class="card p-0 overflow-hidden">
    <div id="products-table" class="overflow-x-auto">
      <div class="p-6 space-y-2">
        <div class="animate-pulse bg-gray-100 rounded h-12"></div>
        <div class="animate-pulse bg-gray-100 rounded h-12"></div>
        <div class="animate-pulse bg-gray-100 rounded h-12"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal stock ajuste -->
<div id="stock-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md mx-4">
    <h3 class="font-bold text-gray-800 mb-4">Ajustar Stock — <span id="modal-prod-name" class="text-primary-600"></span></h3>
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Tipo de ajuste</label>
        <select id="adj-tipo" class="input-base">
          <option value="add">➕ Incrementar</option>
          <option value="sub">➖ Decrementar</option>
          <option value="set">🎯 Establecer valor exacto</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Cantidad</label>
        <input type="number" id="adj-amount" min="0" placeholder="0" class="input-base">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Motivo <span class="text-red-500">*</span></label>
        <input type="text" id="adj-reason" placeholder="Ej: Reconteo físico enero 2026" class="input-base">
      </div>
      <p id="adj-error" class="text-red-600 text-xs hidden"></p>
      <div class="flex gap-3 pt-2">
        <button onclick="closeStockModal()" class="btn-outline flex-1">Cancelar</button>
        <button onclick="submitStockAdj()" class="btn-primary flex-1">Guardar</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/js/api.js"></script>
<script>

let allProducts = [];
let selectedProductId = null;
if (window.location.pathname === "/products") {
  document.addEventListener('DOMContentLoaded', loadProducts);
  document.addEventListener('auth:login', loadProducts);
}

async function loadProducts() {
  const token = localStorage.getItem('token');

  if (!token) {
    window.location.href = '/login';
    return;
  }

  const res = await api('GET', '/api/v1/products');

  console.log("RES PRODUCTS:", res);

  // 🔥 nuevo manejo
  if (!res || res.error) {
    console.error("Error cargando productos");
    return;
  }

  allProducts = res.data; // ✅ CLAVE
  renderTable(allProducts);
}

function filterProducts(q) {
  const query = q.toLowerCase();

  const filtered = q
    ? allProducts.filter(p =>
        (p.Name || p.name || '').toLowerCase().includes(query) ||
        (p.SKU || p.sku || '').toLowerCase().includes(query)
      )
    : allProducts;

  renderTable(filtered);
}

function renderTable(products) {
  if (!products || products.length === 0) {
    document.getElementById('products-table').innerHTML =
      '<p class="text-gray-400 text-sm text-center p-8">Sin productos</p>';
    return;
  }

  document.getElementById('products-table').innerHTML = `
    <table class="w-full text-sm">
      <thead class="bg-gray-50 border-b border-gray-100">
        <tr class="text-xs text-gray-500 uppercase tracking-wide">
          <th class="text-left px-5 py-3">Producto</th>
          <th class="text-left px-5 py-3">SKU</th>
          <th class="text-right px-5 py-3">Costo</th>
          <th class="text-right px-5 py-3">Precio</th>
          <th class="text-center px-5 py-3">Stock</th>
          <th class="text-center px-5 py-3">Estado</th>
          <th class="text-center px-5 py-3">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-50">
        ${products.map(p => `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="px-5 py-3">
              <p class="font-semibold text-gray-800">${p.Name || p.name}</p>
              <p class="text-xs text-gray-400">${p.Category?.Name || p.category?.name || '—'}</p>
            </td>
            <td class="px-5 py-3 font-mono text-xs text-gray-500">${p.SKU || p.sku}</td>
            <td class="px-5 py-3 text-right text-gray-600">S/ ${(p.Cost || p.cost || 0).toFixed(2)}</td>
            <td class="px-5 py-3 text-right font-semibold text-gray-800">S/ ${(p.Price || p.price || 0).toFixed(2)}</td>
            <td class="px-5 py-3 text-center">
              <span class="badge ${(p.Stock || p.stock) === 0 ? 'bg-red-100 text-red-700' : (p.Stock || p.stock) <= 5 ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'}">
                ${p.Stock || p.stock} ud.
              </span>
            </td>
            <td class="px-5 py-3 text-center">
              <span class="badge ${(p.Active !== undefined ? p.Active : p.active) ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">
                ${(p.Active !== undefined ? p.Active : p.active) ? 'Activo' : 'Inactivo'}
              </span>
            </td>
            <td class="px-5 py-3 text-center">
              <button onclick="openStockModal(${p.ID || p.id}, '${(p.Name || p.name).replace(/'/g, '')}')"
                class="text-primary-600 hover:text-primary-800 font-medium text-xs transition">
                📦 Stock
              </button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function openStockModal(id, name) {
  selectedProductId = id;
  document.getElementById('modal-prod-name').textContent = name;
  document.getElementById('adj-amount').value  = '';
  document.getElementById('adj-reason').value  = '';
  document.getElementById('adj-error').classList.add('hidden');
  document.getElementById('stock-modal').classList.remove('hidden');
  document.getElementById('adj-amount').focus();
}

function closeStockModal() {
  document.getElementById('stock-modal').classList.add('hidden');
  selectedProductId = null;
}

async function submitStockAdj() {
  const tipo   = document.getElementById('adj-tipo').value;
  const amount = parseInt(document.getElementById('adj-amount').value);
  const reason = document.getElementById('adj-reason').value.trim();
  const errEl  = document.getElementById('adj-error');

  if (isNaN(amount) || amount < 0) {
    errEl.textContent = 'Ingresa una cantidad válida';
    errEl.classList.remove('hidden');
    return;
  }
  if (reason.length < 5) {
    errEl.textContent = 'El motivo debe tener al menos 5 caracteres';
    errEl.classList.remove('hidden');
    return;
  }

  const res = await api('PATCH', `/api/v1/products/${selectedProductId}/stock`, {
    tipo, amount, reason,
  });


  toast(`Stock actualizado correctamente`, 'success');
  closeStockModal();
  loadProducts();
}

function openCreateModal() {
  toast('Módulo en desarrollo', 'info');
}
</script>
{{end}}
