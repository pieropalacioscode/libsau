<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Librería Saber · Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gradient-to-br from-primary-900 to-primary-800 flex items-center justify-center">
  <script>tailwind.config={theme:{extend:{colors:{primary:{800:'#1e40af',900:'#1e3a8a'}}}}}</script>

  <div class="w-full max-w-sm mx-4">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <div class="bg-gradient-to-r from-primary-700 to-primary-600 px-8 py-8 text-center">
        <span class="text-6xl block mb-3">📚</span>
        <h1 class="text-white font-bold text-2xl">Librería Saber</h1>
        <p class="text-blue-200 text-sm mt-1">Sistema de Ventas</p>
      </div>

      <div class="px-8 py-8 space-y-5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Email
          </label>
          <input id="email" type="email" placeholder="admin@libreriasaber.com"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            onkeydown="if(event.key==='Enter') document.getElementById('password').focus()">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Contraseña
          </label>
          <input id="password" type="password" placeholder="••••••••"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            onkeydown="if(event.key==='Enter') login()">
        </div>

        <p id="error" class="text-red-600 text-xs text-center hidden bg-red-50 rounded-lg py-2 px-3"></p>

        <button onclick="login()" id="btn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg
                 transition-all text-sm tracking-wide">
          Iniciar Sesión
        </button>
      </div>
    </div>
    <p class="text-center text-blue-300 text-xs mt-4">v1.0 MVP · Huancayo, Perú</p>
  </div>

<script>
document.getElementById('email').focus();

// si ya hay sesión → entrar directo
(async function checkSession() {

  const token = sessionStorage.getItem('access_token');

  // no hay sesión frontend
  if (!token) return;

  try {

    // validar sesión REAL con backend
    const res = await fetch('/auth/me', {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    // token válido
    if (res.ok) {
      window.location.href = '/pos';
      return;
    }

  } catch(e) {
    console.warn(e);
  }

  // sesión inválida → limpiar TODO
  sessionStorage.removeItem('access_token');
  sessionStorage.removeItem('current_user');

  document.cookie =
    'access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT';

})();
async function login() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl    = document.getElementById('error');
  const btn      = document.getElementById('btn');

  if (!email || !password) {
    errEl.textContent = 'Completa email y contraseña';
    errEl.classList.remove('hidden');
    return;
  }

  btn.textContent = 'Ingresando...';
  btn.disabled = true;
  errEl.classList.add('hidden');

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await res.json();

    if (!res.ok || !data.access_token) {
      errEl.textContent = data.error || 'Credenciales incorrectas';
      errEl.classList.remove('hidden');
      return;
    }

    // ✅ usar mismo sistema que layout
    sessionStorage.setItem('access_token', data.access_token);
    sessionStorage.setItem('current_user', JSON.stringify(data.user || {}));

    // 🚀 REDIRECCIÓN REAL
    window.location.href = '/pos';

  } catch(e) {
    errEl.textContent = 'Error de conexión';
    errEl.classList.remove('hidden');
  } finally {
    btn.textContent = 'Iniciar Sesión';
    btn.disabled = false;
  }
}
</script>
